name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  cloudflare:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Stamp version
        env:
          TAG: ${{ github.ref_name }}
        run: sed -i "s|\"dev\"|\"${TAG}\"|" src/version.ts

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Stamp version
        env:
          TAG: ${{ github.ref_name }}
        run: sed -i "s|\"dev\"|\"${TAG}\"|" src/version.ts

      - name: Deploy
        id: deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          set -euo pipefail
          url="$(npx vercel deploy --prod --yes 2>/dev/null | tail -n1)"
          echo "Deployment URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: env.VERCEL_TOKEN != ''
        run: |
          set -euo pipefail
          body="$(npx vercel curl "${{ steps.deploy.outputs.url }}/ip" -y)"
          echo "Response: $body"
          echo "$body" | grep -Eq '^[0-9A-Fa-f:.]+$'

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [cloudflare, vercel]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
